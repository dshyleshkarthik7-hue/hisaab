name: Hisaab Cloudflare CI

on:
  pull_request:
  push:
    branches: [main, "migration/cloudflare-full-static"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Python reference tests
        run: python -m unittest discover -s tests -v
      - name: Generate Python reference fixture for browser parity
        run: python tests/generate_browser_fixture.py
      - name: Verify bundled Telugu font glyph coverage
        run: python tests/verify_telugu_font.py
      - name: Install browser build dependencies
        working-directory: web
        run: npm install --ignore-scripts
      - name: TypeScript build
        working-directory: web
        run: npm run build
      - name: Browser JavaScript syntax
        run: node --check web/app.bundle.js
      - name: Core deterministic and calculator tests
        run: npx --yes --package tsx@4.19.2 tsx web/tests/core.test.ts
      - name: Python-to-browser engine parity
        run: npx --yes --package tsx@4.19.2 tsx web/tests/parity.test.ts
      - name: 10,000-trial 40-year baseline benchmark
        run: npx --yes --package tsx@4.19.2 tsx web/tests/benchmark.test.ts
      - name: Install Chromium for browser/PDF validation
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end and PDF font smoke test
        working-directory: web
        run: |
          python -m http.server 8788 --directory . > /tmp/hisaab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          node tests/browser-pdf.test.mjs
      - name: Static artifact checks
        run: test -s web/index.html && test -s web/app.bundle.js && test -s web/src/workers/simulation.worker.bundle.js
      - name: No backend API dependencies in browser entrypoint
        run: '! grep -nE "fetch\\([^)]*/api/|/api/(simulate|emi|tax|salary|mitra|report)" web/app.ts'
      - name: Cloudflare Pages configuration
        run: test -s wrangler.toml && grep -q 'pages_build_output_dir = "web"' wrangler.toml
