name: Hisaab CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax checks
        run: python -m compileall -q python tests
      - name: Compile TypeScript browser artifact
        run: npx --yes --package typescript@5.7.3 tsc -p web
      - name: Verify generated browser artifact is in sync
        run: git diff --exit-code -- web/app.js
      - name: Frontend package check
        run: cd web && npx --yes --package typescript@5.7.3 tsc --noEmit -p tsconfig.json
      - name: Java compile
        run: javac java/Hisaab.java
      - name: Browser JavaScript syntax
        run: node --check web/app.js
      - name: Full-stack smoke test
        run: python tests/smoke.py
      - name: Docker image build
        run: docker build -t hisaab:ci .
      - name: Docker runtime smoke tests
        run: bash tests/docker_smoke.sh
