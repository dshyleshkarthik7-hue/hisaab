services:
  - type: web
    name: hisaab
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: HISAAB_ENGINE_PORT
        value: "8081"
      - key: HISAAB_BIND
        value: "0.0.0.0"
      - key: HISAAB_RATE_LIMIT
        value: "40"
      - key: HISAAB_GLOBAL_RATE_LIMIT
        value: "80"
      - key: HISAAB_HTTP_THREADS
        value: "4"
      - key: HISAAB_TRUST_PROXY_HEADERS
        value: "true"
      - key: HISAAB_DATA_DIR
        value: /tmp/hisaab-data
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=30 -XX:InitialRAMPercentage=10 -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
      - key: HISAAB_LLM_ENABLED
        value: "false"
